      /* ── Boot loader ──────────────────────────────────────────────── */
      .__boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;

      }
      .__boot.is-ready {
        opacity: 0;
        pointer-events: none;
      }
      .__boot__stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 56px;
      }
      .__boot__mark {
        width: 120px;
        height: auto;
        overflow: visible;
        filter: drop-shadow(0 22px 32px rgba(59, 111, 255, 0.12));
      }
      .__boot__outline {
        fill: none;
        stroke: #031542;
        stroke-width: 0.5;
        stroke-linejoin: round;
      }
      /* Water body (clipped to the DR silhouette). Rises bottom→top. */
      .__boot__water {
        animation: boot-rise 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        transform-origin: center bottom;
      }
      /* Wave layer riding on the leading edge — adds a subtle drift. */
      .__boot__wave {
        animation: boot-drift 2.4s linear infinite;
      }
      @keyframes boot-rise {
        0%   { transform: translateY(46px); }
        55%  { transform: translateY(2px); }
        70%  { transform: translateY(-1px); }
        100% { transform: translateY(46px); }
      }
      @keyframes boot-drift {
        0%   { transform: translateX(0); }
        50%  { transform: translateX(-6px); }
        100% { transform: translateX(0); }
      }

      .__boot__caption {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .__boot__bar {
        width: 120px;
        height: 1px;
        background: rgba(3, 21, 66, 0.08);
        position: relative;
        overflow: hidden;
      }
      .__boot__bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        background: #3b6fff;
        transform: translateX(-100%);
        animation: boot-bar 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-bar {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(244%); }
      }
      .__boot__label {
        margin: 0;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.28em;
        color: rgba(3, 21, 66, 0.45);
        text-transform: uppercase;
      }

      @media (prefers-reduced-motion: reduce) {
        .__boot__water,
        .__boot__wave,
        .__boot__bar::after {
          animation: none;
        }
        .__boot__water { transform: translateY(8px); }
      }

    <script>
      /*
       * Gate-based boot dismissal.
       *
       * The loader stays on screen as long as the page genuinely takes to
       * load — not a fixed timer. It dismisses only after *all* gates pass:
       *
       *   - "dom"  → window.load has fired (HTML + static assets done)
       *   - "app"  → React signalled the first route component mounted
       *              (window.__bootReady("app"))
       *   - "hero" → critical above-the-fold image has decoded
       *
       * A 25-second ceiling is the only artificial limit, and exists purely
       * so a stalled network can never leave the user staring at the loader
       * forever. Under normal conditions the gates dictate timing.
       */
      (function () {
        var hidden = false;
        var ready = { dom: false, app: false, hero: false };

        function dismiss() {
          if (hidden) return;
          hidden = true;
          var el = document.getElementById("__boot");
          if (!el) return;
          el.classList.add("is-ready");
          window.setTimeout(function () {
            el.parentNode && el.parentNode.removeChild(el);
          }, 800);
        }

        function check() {
          if (hidden) return;
          for (var k in ready) {
            if (!ready[k]) return;
          }
          dismiss();
        }

        function pass(name) {
          if (ready[name] === undefined) return;
          if (ready[name]) return;
          ready[name] = true;
          check();
        }

        // Gate 1 — DOM + static resources finished
        if (document.readyState === "complete") {
          pass("dom");
        } else {
          window.addEventListener(
            "load",
            function () {
              pass("dom");
            },
            { once: true }
          );
        }

        // Gate 2 — App signal. React will call window.__bootReady("app")
        // from the first real route component's mount effect (after the
        // route chunk has been fetched and rendered — i.e. when there's
        // a real page underneath, not just the Suspense fallback).
        window.__bootReady = pass;

        // Gate 3 — hero LCP image decoded. We start a parallel decode so
        // the gate often closes before "load" anyway. If the file isn't
        // present (404, very old browser), the error handler resolves it.
        try {
          var heroProbe = new Image();
          heroProbe.decoding = "async";
          heroProbe.onload = function () {
            pass("hero");
          };
          heroProbe.onerror = function () {
            pass("hero");
          };
          heroProbe.src =
            "/assets/images/P01_S01_home_hero_optA_image.avif";
        } catch (_) {
          pass("hero");
        }

        // Absolute safety ceiling. Real-world: stalled CDN, broken script,
        // misconfigured route. We refuse to imprison the user past 25 s.
        window.setTimeout(function () {
          for (var k in ready) ready[k] = true;
          dismiss();
        }, 25000);

        // Back-compat: a few callers still invoke __hideBoot directly.
        window.__hideBoot = function () {
          pass("app");
        };
      })();
    </script>
